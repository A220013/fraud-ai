version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    environment:
      - PORT=3000

  frontend:
    build: ./frontend/frontend
    ports:
      - "80:80"
    depends_on:
      - backend